[project]
name = "redcell-verifiers"
version = "0.0.0"
description = "Deterministic breach oracle (the crown jewel) — pure, versioned, LLM-free"
requires-python = ">=3.12"
dependencies = ["redcell-core"]
# Phase 2 adds: presidio-analyzer (PII), jsonschema (schema violation)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redcell_verifiers"]
