[project]
name = "redcell-eval"
version = "0.0.0"
description = "LLM-as-judge (audited secondary instrument) + Cohen's kappa"
requires-python = ">=3.12"
dependencies = ["redcell-core"]
# the real judge uses `anthropic` (already a workspace dep); offline judge is stdlib

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redcell_eval"]
