[project]
name = "redcell-attackers"
version = "0.0.0"
description = "LangGraph supervisor + 5 attack workers + RLVR mutation loop"
requires-python = ">=3.12"
dependencies = [
    "redcell-core",
    "redcell-verifiers",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres",
    "langsmith>=0.1",       # observability (auto-instruments LangGraph)
    "anthropic>=0.40",
    "openai>=1.0",          # points at the SLM (vLLM/Groq/Together) OpenAI-compatible endpoint
    "tenacity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redcell_attackers"]
