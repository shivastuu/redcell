[project]
name = "redcell-target"
version = "0.0.0"
description = "The System Under Test: fintech triage agent + custom FastMCP server"
requires-python = ">=3.12"
dependencies = [
    "redcell-core",
    "fastmcp>=2.0",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redcell_target"]
