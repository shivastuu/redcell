name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  spine:
    # The deterministic verifier runs with ZERO third-party deps — green from day zero.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: full suite (stdlib only — no installs, no keys)
        run: |
          python3 scripts/demo_verifier.py
          python3 tests/test_verifier_determinism.py
          python3 tests/test_campaign_asr_collapse.py
          python3 tests/test_seed.py
          python3 tests/test_eval.py
          python3 scripts/run_campaign.py
          python3 scripts/run_eval.py

  full:
    # Full workspace test suite once dependencies exist. Non-blocking until Phase 2.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run pytest -q
