# The single source of truth for what RedCell may attack.
# Content-hashed; the hash is stamped into every trace and re-verified in CI.
# Class-C entries require a GPG-signed human commit + a permission evidence bundle.
schema_version: 1
scope_id: "redcell-scope-2026-07"

targets:
  - id: "own-fintech-agent"          # Class A — the target you build
    class: A
    endpoint: "http://localhost:8710/mcp"   # loopback only
    server_version: "git:redcell@HEAD"
    attack_profile: full

